---
# Qwen 2.5 1.5B Instruct - LLMInferenceService (NEW API)
# Full UI integration with hardware profile and connection
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen-llm
  namespace: doclocal-ai-models
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    opendatahub.io/connections: "qwen"
    opendatahub.io/hardware-profile-name: "gpu-profile"
    opendatahub.io/hardware-profile-namespace: "redhat-ods-applications"
    opendatahub.io/model-type: "generative"
    openshift.io/display-name: "Qwen 2.5 1.5B Instruct"
    security.opendatahub.io/enable-auth: "false"
spec:
  model:
    name: qwen-llm
    uri: hf://Qwen/Qwen2.5-1.5B-Instruct
  replicas: 1
  router:
    gateway: {}
    route: {}
    scheduler: {}
  template:
    containers:
    - name: main
      env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: huggingface-token
            key: HF_TOKEN
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 12Gi
          nvidia.com/gpu: "1"
