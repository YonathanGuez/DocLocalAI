---
# BGE Small EN v1.5 - LLMInferenceService (Embeddings)
# No separate GPU is requested/available on this cluster (single-GPU node, already
# claimed by qwen-llm), so this shares qwen's physical GPU. Its memory footprint is
# capped way down via --gpu-memory-utilization since the model itself is tiny.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: bge-llm
  namespace: doclocal-ai-models
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    opendatahub.io/connections: "bge"
    opendatahub.io/model-type: "generative"
    openshift.io/display-name: "BGE Small EN v1.5 (Embeddings)"
    security.opendatahub.io/enable-auth: "false"
spec:
  model:
    name: bge-llm
    uri: hf://BAAI/bge-small-en-v1.5
  replicas: 1
  router:
    gateway: {}
    route: {}
    scheduler: {}
  template:
    containers:
    - name: main
      env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: huggingface-token
            key: HF_TOKEN
      - name: VLLM_TASK
        value: "embed"
      - name: VLLM_ADDITIONAL_ARGS
        value: "--gpu-memory-utilization 0.1"
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 8Gi
