apiVersion: v1
kind: Secret
metadata:
  name: <NAMESPACE>-secrets
  namespace: <NAMESPACE>
type: Opaque
stringData:
  POSTGRES_USER: doclocalai
  POSTGRES_PASSWORD: <CHANGE_PASSWORD>
  DATABASE_URL: postgresql://doclocalai:<CHANGE_PASSWORD>@doclocal-ai-db:5432/doclocalai
  # OpenShift AI Model Endpoints - Internal cluster URLs (HTTPS)
  LLM_ENDPOINT_URL: "<LLM_ENDPOINT_URL>"
  LLM_MODEL_NAME: "<LLM_MODEL_NAME>"
  LLM_API_TOKEN: ""
  EMBEDDING_ENDPOINT_URL: "<EMBEDDING_ENDPOINT_URL>"
  EMBEDDING_MODEL_NAME: "<EMBEDDING_MODEL_NAME>"
