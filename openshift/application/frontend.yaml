---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doclocal-ai-ui
  namespace: doclocal-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doclocal-ai-ui
  template:
    metadata:
      labels:
        app: doclocal-ai-ui
    spec:
      imagePullSecrets:
        - name: quay-pull-secret
      containers:
        - name: frontend
          image: quay.io/yonig/doclocalai-ui:v10
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            - name: DOCLOCALAI_API_URL
              value: "http://doclocal-ai-api:8000"
            - name: APP_TITLE
              valueFrom:
                configMapKeyRef:
                  name: doclocal-ai-config
                  key: APP_TITLE
            - name: APP_PAGE_TITLE
              valueFrom:
                configMapKeyRef:
                  name: doclocal-ai-config
                  key: APP_PAGE_TITLE
          livenessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: doclocal-ai-ui
  namespace: doclocal-ai
spec:
  selector:
    app: doclocal-ai-ui
  ports:
    - port: 8501
      targetPort: 8501
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: doclocal-ai-ui
  namespace: doclocal-ai
spec:
  to:
    kind: Service
    name: doclocal-ai-ui
  port:
    targetPort: 8501
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
